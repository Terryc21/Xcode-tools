name: Correction
description: Something in the docs is wrong, outdated, or incomplete
labels: ["correction"]
body:
  - type: input
    id: tool
    attributes:
      label: Which tool?
      placeholder: xcodebuild, actool, ibtool, etc.
    validations:
      required: true

  - type: textarea
    id: current
    attributes:
      label: What the docs currently say
      description: Copy the relevant section or quote the line that is wrong.
    validations:
      required: true

  - type: textarea
    id: correct
    attributes:
      label: What's actually correct
      description: Apple docs link, man page excerpt, or a command-line proof.
    validations:
      required: true

  - type: input
    id: xcode-version
    attributes:
      label: Xcode version you verified on
      placeholder: Xcode 26.3
    validations:
      required: true
